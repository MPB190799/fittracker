# Bei jedem Push: Syntax + Worker-Logik + Browser-Smoke-Test. Fängt „nichts klickbar“-Regressionen
# und kaputte Foto-KI-/Whoop-Logik ab, bevor Marco es am Handy merkt. Kostenlos (öffentliches Repo).
name: check
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --check app.js && node --check sw.js && node --check whoop-worker/src/worker.js
      - run: node tests/worker.test.mjs
      - run: npm i --no-save playwright@1 && npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8099 >/dev/null 2>&1 &
          sleep 1
          node tests/smoke.mjs

  # Worker automatisch deployen — läuft erst, wenn im Repo die Secrets CLOUDFLARE_API_TOKEN
  # (+ CLOUDFLARE_ACCOUNT_ID) hinterlegt sind. Ohne Secrets wird der Schritt übersprungen.
  deploy-worker:
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: whoop-worker
        run: npx --yes wrangler@4 deploy
