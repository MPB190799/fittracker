<title>Lebenskompass · MB Capital Strategies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#D4AF37; --gold-hi:#efd98a; --gold-lo:#9d7e22;
  --bg:#080810; --bg2:#0f0f1a; --green:#22c55e; --red:#ef4444;
  --line:rgba(212,175,55,.16); --line2:#1c1c2e; --text:#ecebe6; --muted:#8c8ca2;
  --goldgrad:linear-gradient(135deg,#f3df97 0%,#D4AF37 48%,#a8872a 100%);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:'Outfit',system-ui,-apple-system,sans-serif;font-weight:400;font-size:17px;line-height:1.5}
body{min-height:100vh;padding-bottom:calc(92px + env(safe-area-inset-bottom));
  background:
   radial-gradient(900px 500px at 85% -120px, rgba(212,175,55,.10), transparent 60%),
   radial-gradient(700px 500px at -10% 30%, rgba(212,175,55,.045), transparent 60%),
   var(--bg);
  background-attachment:fixed}
.mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace}
/* Wasserzeichen-Kompass */
body::before{content:"";position:fixed;right:-140px;top:90px;width:520px;height:520px;background:var(--compass) center/contain no-repeat;opacity:.045;pointer-events:none;z-index:0}
header,main,nav{position:relative;z-index:1}
header{display:flex;align-items:center;gap:16px;padding:calc(20px + env(safe-area-inset-top)) 26px 18px;max-width:900px;margin:0 auto}
header::after{content:"";position:absolute;left:26px;right:26px;bottom:0;height:1px;background:linear-gradient(90deg,transparent,rgba(212,175,55,.6),transparent)}
header .mark{width:54px;height:54px;object-fit:contain;filter:drop-shadow(0 0 14px rgba(212,175,55,.28))}
.wm{font-weight:300;font-size:1.5rem;letter-spacing:.3em;text-transform:uppercase;background:var(--goldgrad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
header .sub{color:var(--muted);font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;margin-top:5px}
main{max-width:900px;margin:0 auto;padding:26px 18px 40px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(8,8,16,.88);border-top:1px solid var(--line);display:flex;justify-content:center;gap:4px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
nav button{flex:1;max-width:150px;background:none;border:0;color:var(--muted);font:inherit;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;padding:9px 4px 7px;border-radius:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;transition:color .2s}
nav button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--gold-hi)}
nav button.on::after{content:"";width:22px;height:2px;border-radius:2px;background:var(--goldgrad);margin-top:1px}
.card{position:relative;background:linear-gradient(180deg,#11111e 0%,#0b0b15 100%);border:1px solid var(--line);border-radius:18px;padding:22px 22px 20px;margin-bottom:18px;box-shadow:0 1px 0 rgba(255,255,255,.035) inset,0 26px 50px -30px rgba(0,0,0,.9)}
.card::before{content:"";position:absolute;left:22px;right:22px;top:-1px;height:1px;background:linear-gradient(90deg,transparent,rgba(239,217,138,.55),transparent)}
.card h2{font-size:.74rem;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:16px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.card h2 small{font-weight:300;letter-spacing:.06em;text-transform:none;color:var(--muted);font-size:.86rem}
.hero{display:flex;align-items:center;gap:18px}
.hero h1{font-weight:200;font-size:2rem;letter-spacing:.02em;line-height:1.15}
.hero h1 em{font-style:normal;background:var(--goldgrad);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:300}
h3{font-size:.7rem;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.2em;margin:18px 0 8px}
.muted{color:var(--muted)}
.hint{color:var(--muted);font-size:.93rem;font-weight:300;padding:4px 0}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
ul.tasks{list-style:none}
.task{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line2)}
.task:last-child{border-bottom:0}
.chk{width:32px;height:32px;border-radius:50%;border:1.5px solid rgba(212,175,55,.5);background:none;color:transparent;cursor:pointer;flex:none;display:grid;place-items:center;transition:all .2s}
.chk svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.task.done .chk{background:var(--green);border-color:var(--green);color:#04130a;box-shadow:0 0 14px rgba(34,197,94,.35)}
.task.done .tx{text-decoration:line-through;text-decoration-color:rgba(140,140,162,.6);color:var(--muted)}
.tx{flex:1;min-width:0;word-break:break-word;font-weight:300;font-size:1.03rem}
.chip{font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--gold-lo);white-space:nowrap}
.ico{background:none;border:0;color:#5f5f78;font-size:1.1rem;width:38px;height:38px;border-radius:10px;cursor:pointer;display:grid;place-items:center}
.ico svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ico:active{background:#1b1b2e}
.ico.star.on{color:var(--gold)}
.ico.star.on svg{fill:var(--gold)}
input[type=date]{background:rgba(5,5,12,.7);border:1px solid var(--line2);color:var(--text);font:inherit;border-radius:12px;padding:9px 12px;color-scheme:dark}
input[type=text],select,textarea{background:rgba(5,5,12,.7);border:1px solid var(--line2);color:var(--text);font:inherit;font-weight:300;border-radius:12px;padding:13px 15px;width:100%;transition:border-color .2s,box-shadow .2s}
input[type=text]:focus,select:focus,textarea:focus{outline:none;border-color:rgba(212,175,55,.65);box-shadow:0 0 0 3px rgba(212,175,55,.08)}
textarea{min-height:88px;resize:vertical}
select{width:auto;max-width:180px}
.btn{background:var(--goldgrad);color:#17130a;border:0;font:inherit;font-weight:500;letter-spacing:.06em;padding:13px 24px;border-radius:12px;cursor:pointer;box-shadow:0 10px 26px -12px rgba(212,175,55,.6),0 1px 0 rgba(255,255,255,.35) inset}
.btn:active{filter:brightness(.92)}
.btn.ghost{background:none;color:var(--gold-hi);border:1px solid rgba(212,175,55,.5);box-shadow:none}
.btn.small{padding:9px 16px;font-size:.88rem}
form.add{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
form.add input[type=text]{flex:1;min-width:180px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:linear-gradient(180deg,#11111e,#0b0b15);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.kpi b{display:block;font-family:'IBM Plex Mono',monospace;font-size:1.8rem;font-weight:400;background:var(--goldgrad);-webkit-background-clip:text;background-clip:text;color:transparent}
.kpi span{color:var(--muted);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase}
.ring{width:92px;height:92px;flex:none}
.steps{display:flex;gap:10px;margin-bottom:18px}
.steps div{flex:1;text-align:center;padding:11px 4px;border-radius:12px;border:1px solid var(--line2);color:var(--muted);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;cursor:pointer}
.steps div.on{border-color:rgba(212,175,55,.7);color:var(--gold-hi);background:rgba(212,175,55,.06)}
.steps div.ok{color:var(--green);border-color:rgba(34,197,94,.4)}
.slider{display:grid;grid-template-columns:120px 1fr 40px;gap:14px;align-items:center;padding:10px 0}
.slider label{font-weight:300}
.slider output{font-family:'IBM Plex Mono',monospace;color:var(--gold-hi);text-align:right}
input[type=range]{width:100%;accent-color:var(--gold);height:34px}
label.lb{display:block;margin:16px 0 7px;font-weight:400}
label.lb small{color:var(--muted);font-weight:300}
.pill{display:inline-flex;gap:8px;flex-wrap:wrap}
.pill button{background:none;border:1px solid var(--line2);color:var(--muted);font:inherit;font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;padding:7px 14px;border-radius:99px;cursor:pointer}
.pill button.on{border-color:rgba(212,175,55,.7);color:var(--gold-hi);background:rgba(212,175,55,.07)}
svg text{font-family:'IBM Plex Mono',monospace;fill:var(--muted);font-size:10px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px}
.heat i{display:block;aspect-ratio:1;border-radius:4px;background:#14142a;min-width:12px}
.insight{padding:12px 15px;border-left:2px solid var(--gold);background:linear-gradient(90deg,rgba(212,175,55,.07),transparent);border-radius:0 10px 10px 0;margin-bottom:10px;font-weight:300}
.entry{padding:10px 0;border-bottom:1px solid var(--line2);font-weight:300}
.entry:last-child{border-bottom:0}
.entry small{color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:.72rem;margin-right:10px;letter-spacing:.06em}
.good{color:var(--green)} .bad{color:var(--red)}
.toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--goldgrad);color:#17130a;padding:12px 24px;border-radius:99px;font-weight:500;letter-spacing:.04em;z-index:30;box-shadow:0 14px 40px rgba(0,0,0,.6)}
.legend{display:flex;gap:16px;font-size:.72rem;letter-spacing:.08em;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.focusline{display:flex;align-items:center;gap:12px;margin:2px 0 6px}
.focusline input{border:0;border-bottom:1px solid rgba(212,175,55,.35);border-radius:0;background:transparent;padding:8px 2px;font-size:1.1rem;font-weight:300;box-shadow:none}
.focusline input:focus{border-bottom-color:var(--gold);box-shadow:none}
.logo-full{display:block;margin:6px auto 4px;width:200px;max-width:60%;opacity:.95}
.radar-wrap{display:grid;place-items:center}
.goal{padding:14px 0;border-bottom:1px solid var(--line2)}
.goal:last-child{border-bottom:0}
.goal .gt{display:flex;gap:10px;align-items:center;font-weight:300;font-size:1.02rem;margin-bottom:8px}
.goal .gt .grow{min-width:0;overflow-wrap:anywhere}
.gbar{height:5px;border-radius:5px;background:#17172b;overflow:hidden;margin-bottom:2px}
.gbar i{display:block;height:100%;border-radius:5px;transition:width .15s}
.goal .gs{display:grid;grid-template-columns:1fr 46px;gap:10px;align-items:center}
.goal output{font-family:'IBM Plex Mono',monospace;color:var(--gold-hi);text-align:right;font-size:.9rem}
.pnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 18px}
.pnav b{font-weight:300;font-size:1.15rem;letter-spacing:.04em;text-align:center;flex:1}
.pnav button{background:none;border:1px solid var(--line2);color:var(--gold-hi);border-radius:12px;width:44px;height:40px;font-size:1.2rem;cursor:pointer}
.abar{display:grid;grid-template-columns:130px 1fr 54px;gap:12px;align-items:center;padding:6px 0;font-weight:300;font-size:.92rem}
.abar .tr{height:8px;border-radius:8px;background:#17172b;overflow:hidden}
.abar .tr i{display:block;height:100%;border-radius:8px;background:var(--goldgrad)}
.abar span.mono{text-align:right;color:var(--muted);font-size:.78rem}
.syncbox .st{font-size:.9rem;color:var(--muted);margin:10px 0 2px}
.syncbox .ok{color:var(--good,#22c55e)}
#nightfilter{position:fixed;inset:0;z-index:999;pointer-events:none;background:rgb(255,176,96);mix-blend-mode:multiply;opacity:0;transition:opacity .4s}
#nightfilter.on{opacity:1}
.gpar{font-size:.78rem;color:var(--muted);margin:-4px 0 8px;letter-spacing:.02em}
.gpar b{color:var(--gold-hi);font-weight:400}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin:12px 0 4px}
.dots i{width:14px;height:14px;border-radius:4px;background:#17172b}
.dots i.ok{background:var(--goldgrad)}.dots i.miss{background:#2a1416}.dots i.now{outline:1px solid var(--gold-hi)}
.rv-actions{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
@media print{
  nav,header,.rv-actions,#nightfilter,.toast{display:none!important}
  html,body{background:#080810!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .card{break-inside:avoid;box-shadow:none}
  main{padding:0!important}
}
.page{position:relative;padding:30px 30px 26px;border-radius:6px 18px 18px 6px;background:linear-gradient(90deg,#0b0b15 0,#11111e 22px,#11111e 100%);border:1px solid var(--line);box-shadow:inset 14px 0 18px -14px rgba(0,0,0,.9),0 26px 50px -30px rgba(0,0,0,.9)}
.page::after{content:"";position:absolute;left:18px;top:0;bottom:0;width:1px;background:rgba(212,175,55,.18)}
.page h1{font-weight:200;font-size:1.7rem;letter-spacing:.04em;margin-bottom:2px}
.page h3{margin-top:22px}
.page .pg{position:absolute;right:24px;bottom:14px;font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:var(--muted)}
.page .line{font-weight:300;line-height:1.6;padding:3px 0;white-space:pre-wrap}
.bnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 16px}
.bnav button{background:none;border:1px solid var(--line2);color:var(--gold-hi);border-radius:12px;padding:10px 16px;font:inherit;font-size:.85rem;cursor:pointer}
.bnav button[disabled]{opacity:.3;cursor:default}
@media (max-width:560px){.abar{grid-template-columns:96px 1fr 48px}.slider{grid-template-columns:88px 1fr 34px}.chip{display:none}.hero h1{font-size:1.55rem}.wm{font-size:1.15rem;letter-spacing:.22em}}
</style>
</head>

</header>
<div id="nightfilter"></div>
<main id="app"></main>
<nav id="nav"></nav>

var OLD_HABITS='Sport / Bewegung|Lesen|Früh ins Bett';

function norm(s){
  if(!s||typeof s.days!=='object'||s.days===null||Array.isArray(s.days))return null;
  if(!Array.isArray(s.areas)||!s.areas.length)s.areas=DEFAULT_AREAS.slice();
  if(typeof s.name!=='string')s.name='Marco';
  if(!s.goals||typeof s.goals!=='object')s.goals={};
  ['w','m','q','y'].forEach(function(h){if(!s.goals[h]||typeof s.goals[h]!=='object')s.goals[h]={};});
  if(!s.notes||typeof s.notes!=='object')s.notes={};
  if(!s.vision||typeof s.vision!=='object')s.vision={warum:'',vision:'',werte:''};
  if(!Array.isArray(s.habits)||s.habits.map(function(x){return x.name;}).join('|')===OLD_HABITS)s.habits=DEFAULT_HABITS.map(function(n,i){return {id:'h'+i,name:n};});
  if(!s._u||typeof s._u!=='object')s._u={};
  return s;
}
function freshState(){return norm({name:'Marco',areas:DEFAULT_AREAS.slice(),days:{}});}
function load(){
  try{var r=localStorage.getItem(KEY); if(r){var s=norm(JSON.parse(r)); if(s)return s;}}catch(e){}
  return freshState();
}
var state=load();
var storageOK=true;
function persist(){
  try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;}
  catch(e){storageOK=false;toast('Speichern im Browser nicht möglich – bitte Backup exportieren');}
}
/* Jedes Element (Tag, Zielliste, Notiz, Stammdaten) bekommt einen Zeitstempel; so lassen sich Geräte zusammenführen. */
function itemsOf(s){
  var o={};
  Object.keys(s.days).forEach(function(dt){o['d:'+dt]=JSON.stringify(s.days[dt]);});
  ['w','m','q','y'].forEach(function(h){Object.keys(s.goals[h]||{}).forEach(function(k){o['g:'+h+':'+k]=JSON.stringify(s.goals[h][k]);});});
  Object.keys(s.notes).forEach(function(k){o['n:'+k]=JSON.stringify(s.notes[k]);});
  o.meta=JSON.stringify({name:s.name,areas:s.areas,habits:s.habits});
  o.vision=JSON.stringify(s.vision);
  return o;
}
var lastItems=itemsOf(state);
function stamp(){
  var cur=itemsOf(state),now=Date.now();
  Object.keys(cur).forEach(function(k){if(lastItems[k]!==cur[k])state._u[k]=now;});
  lastItems=cur;
}
function save(){stamp();persist();scheduleSync();}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pad(n){return n<10?'0'+n:''+n;}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parse(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2],12,0,0);}
function today(){return window.LK_TODAY||ymd(new Date());}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return ymd(d);}
function niceDate(s){var d=parse(s);return WD[d.getDay()]+', '+d.getDate()+'. '+MONTHS[d.getMonth()];}
function shortDate(s){var d=parse(s);return d.getDate()+'.'+(d.getMonth()+1)+'.';}
function mean(a){return a.length?a.reduce(function(x,y){return x+y;},0)/a.length:null;}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function mondayOf(s){var d=parse(s);var k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);return ymd(d);}
function ensureDay(dt){
  if(!state.days[dt])state.days[dt]={tasks:[],ratings:{},gut:'',schlecht:'',gelernt:'',erfolge:['','',''],dankbar:'',intention:'',reviewed:false};
  var d=state.days[dt];d.tasks=d.tasks||[];d.ratings=d.ratings||{};
  if(!Array.isArray(d.erfolge))d.erfolge=['','',''];
  while(d.erfolge.length<3)d.erfolge.push('');
  return d;
}
function tasksOf(dt){var d=state.days[dt];return d&&d.tasks?d.tasks:[];}

/* ====== Kennzahlen ====== */
function dayStats(dt){
  var d=state.days[dt]; if(!d)return null;
  var t=d.tasks||[], done=t.filter(function(x){return x.done;}).length;
  var rv=RATINGS.map(function(r){return d.ratings&&d.ratings[r[0]];}).filter(function(v){return typeof v==='number';});
  return {dt:dt,total:t.length,done:done,quote:t.length?done/t.length:null,score:rv.length?mean(rv):null,ratings:d.ratings||{},reviewed:!!d.reviewed};
}
function range(endDt,n){var a=[],i;for(i=n-1;i>=0;i--)a.push(addDays(endDt,-i));return a;}
function streak(){
  var t=today(), dt=(state.days[t]&&state.days[t].reviewed)?t:addDays(t,-1), n=0;
  while(state.days[dt]&&state.days[dt].reviewed){n++;dt=addDays(dt,-1);}
  return n;
}
function reviewedCount(){return Object.keys(state.days).filter(function(k){return state.days[k].reviewed;}).length;}
function quoteOver(days){
  var tot=0,dn=0;days.forEach(function(dt){var t=tasksOf(dt);tot+=t.length;dn+=t.filter(function(x){return x.done;}).length;});
  return tot?dn/tot:null;
}
function avgRating(key,days){
  var v=[];days.forEach(function(dt){var d=state.days[dt];if(d&&d.ratings&&typeof d.ratings[key]==='number')v.push(d.ratings[key]);});
  return mean(v);
}
function erfolgeCount(){var n=0;Object.keys(state.days).forEach(function(k){(state.days[k].erfolge||[]).forEach(function(e){if(e&&e.trim())n++;});});return n;}
function insights(){
  var out=[],n=reviewedCount();
  if(n<14)return {ready:false,have:n,items:[]};
  var rows=Object.keys(state.days).map(dayStats).filter(function(s){return s&&s.reviewed;});
  [['schlaf','Schlaf'],['bewegung','Bewegung'],['energie','Energie'],['stimmung','Stimmung']].forEach(function(m){
    var hi=rows.filter(function(s){return typeof s.ratings[m[0]]==='number'&&s.ratings[m[0]]>=7;});
    var lo=rows.filter(function(s){return typeof s.ratings[m[0]]==='number'&&s.ratings[m[0]]<=5;});
    if(hi.length<3||lo.length<3)return;
    var hq=hi.filter(function(s){return s.quote!==null;}).map(function(s){return s.quote;});
    var lq=lo.filter(function(s){return s.quote!==null;}).map(function(s){return s.quote;});
    if(hq.length>=3&&lq.length>=3){
      var dq=(mean(hq)-mean(lq))*100;
      if(Math.abs(dq)>=10)out.push({w:Math.abs(dq)/10,t:'An Tagen mit hohem '+m[1]+' (7+) erledigst du im Schnitt '+Math.abs(Math.round(dq))+' Prozentpunkte '+(dq>0?'mehr':'weniger')+' deiner Aufgaben als an Tagen mit niedrigem ('+hi.length+' vs. '+lo.length+' Tage).'});
    }
    if(m[0]!=='energie'){
      var hf=hi.filter(function(s){return typeof s.ratings.fokus==='number';}).map(function(s){return s.ratings.fokus;});
      var lf=lo.filter(function(s){return typeof s.ratings.fokus==='number';}).map(function(s){return s.ratings.fokus;});
      if(hf.length>=3&&lf.length>=3){
        var df=mean(hf)-mean(lf);
        if(Math.abs(df)>=1)out.push({w:Math.abs(df),t:'Dein Fokus liegt an Tagen mit hohem '+m[1]+' im Schnitt '+Math.abs(df).toFixed(1).replace('.',',')+' Punkte '+(df>0?'höher':'niedriger')+'.'});
      }
    }
  });
  out.sort(function(a,b){return b.w-a.w;});
  return {ready:true,have:n,items:out.slice(0,4)};
}
function colFor(v){ /* 0..1: rot -> gold -> grün */
  v=Math.max(0,Math.min(1,v));
  var A=[239,68,68],B=[212,175,55],C=[34,197,94],p,q,t;
  if(v<.5){p=A;q=B;t=v/.5;}else{p=B;q=C;t=(v-.5)/.5;}
  return 'rgb('+[0,1,2].map(function(i){return Math.round(p[i]+(q[i]-p[i])*t);}).join(',')+')';
}

/* ====== UI-Zustand ====== */
var ui={tab:'heute',step:1,metric:'stimmung',hm:'score',hz:'w',off:0};
var TABS=[['heute','Heute'],['abend','Abend'],['morgen','Morgen'],['plan','Planung'],['auswertung','Kompass'],['daten','Daten']];

function areaOptions(sel){return state.areas.map(function(a){return '<option'+(a===sel?' selected':'')+'>'+esc(a)+'</option>';}).join('');}
function addForm(dt,ph){
  return '<form class="add" data-f="add" data-dt="'+dt+'"><input type="text" name="text" placeholder="'+esc(ph)+'" autocomplete="off" maxlength="200"><select name="area" aria-label="Lebensbereich">'+areaOptions('')+'</select><button class="btn" type="submit">Hinzufügen</button></form>';
}
function taskRow(t,dt,opt){
  opt=opt||{};
  return '<li class="task'+(t.done?' done':'')+'" data-id="'+t.id+'">'+
    (opt.noCheck?'':'<button class="chk" data-a="toggle" data-dt="'+dt+'" data-id="'+t.id+'" aria-label="abhaken">'+IC.check+'</button>')+
    '<span class="tx">'+esc(t.text)+'</span>'+
    (t.area?'<span class="chip">'+esc(t.area)+'</span>':'')+
    '<button class="ico star'+(t.star?' on':'')+'" data-a="star" data-dt="'+dt+'" data-id="'+t.id+'" aria-label="Top 3" title="Top 3">'+IC.star+'</button>'+
    (opt.noMove?'':'<button class="ico" data-a="move" data-dt="'+dt+'" data-id="'+t.id+'" aria-label="auf morgen schieben" title="auf morgen schieben">'+IC.move+'</button>')+
    '<button class="ico" data-a="del" data-dt="'+dt+'" data-id="'+t.id+'" aria-label="löschen" title="löschen">'+IC.del+'</button></li>';
}
function sorted(ts){return ts.slice().sort(function(a,b){return (b.star?1:0)-(a.star?1:0);});}

function ring(done,total){
  var p=total?done/total:0,R=37,C=2*Math.PI*R;
  return '<svg class="ring" viewBox="0 0 92 92"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3df97"/><stop offset=".5" stop-color="#D4AF37"/><stop offset="1" stop-color="#a8872a"/></linearGradient></defs><circle cx="46" cy="46" r="'+R+'" fill="none" stroke="#17172b" stroke-width="5"/><circle cx="46" cy="46" r="'+R+'" fill="none" stroke="'+(p>=1?'#22c55e':'url(#rg)')+'" stroke-width="5" stroke-linecap="round" stroke-dasharray="'+(C*p).toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 46 46)"/><text x="46" y="51" text-anchor="middle" style="font-size:15px;fill:#ecebe6">'+done+'/'+total+'</text></svg>';
}

/* ====== Ansichten ====== */
function viewHeute(){
  var t=today(),ts=sorted(tasksOf(t)),done=ts.filter(function(x){return x.done;}).length,y=state.days[addDays(t,-1)],d=state.days[t];
  var h='';
  h+='<div class="card"><div class="hero"><div class="grow"><h1>'+greeting()+', <em>'+esc(state.name||'')+'</em></h1><div class="hint" style="margin-top:6px">'+esc(niceDate(t))+' · '+
    (ts.length?(done===ts.length?'Alles erledigt – stark.':'Noch '+(ts.length-done)+' offen. Beginne mit dem Stern.'):'Noch nichts geplant. Plane am Abend den nächsten Tag.')+'</div></div>'+ring(done,ts.length)+'</div>'+
    '<h3>Mein Fokus heute</h3><div class="focusline"><input type="text" id="intention" data-i="text" data-k="intention" maxlength="140" placeholder="Was soll heute gelingen?" value="'+esc(d&&d.intention||'')+'" autocomplete="off"></div></div>';
  h+='<div class="row" style="margin:-4px 0 18px;justify-content:flex-end"><button class="btn ghost" data-a="book">📖 Mein Tagebuch lesen</button></div>';
  if(y&&(y.gut||y.gelernt||(y.erfolge&&y.erfolge.join('').trim()))){
    h+='<div class="card"><h2>Von gestern <small>'+esc(niceDate(addDays(t,-1)))+'</small></h2>'+
      (y.erfolge&&y.erfolge.join('').trim()?y.erfolge.filter(function(e){return e&&e.trim();}).map(function(e){return '<div class="entry"><small class="good">ERFOLG</small>'+esc(e)+'</div>';}).join(''):'')+
      (y.gut?'<div class="entry"><small class="good">GUT</small>'+esc(y.gut)+'</div>':'')+
      (y.gelernt?'<div class="entry"><small>GELERNT</small>'+esc(y.gelernt)+'</div>':'')+'</div>';
  }
  h+=habitCard();
  h+=challengeCard();
  var vc=visionCard(false);
  h+='<div class="card"><h2>Aufgaben <small>Stern = Top 3</small></h2>'+(ts.length?'<ul class="tasks">'+ts.map(function(x){return taskRow(x,t);}).join('')+'</ul>':'<div class="hint">Keine Aufgaben.</div>')+addForm(t,'Neue Aufgabe für heute …')+'</div>';
  h+=flashback()+vc;
  return h;
}
function tomb(dt,ids){var d=ensureDay(dt);d.del=(d.del||[]).concat(ids).slice(-200);}
function habitDone(dt,id){var d=state.days[dt];return !!(d&&d.habits&&d.habits[id]);}
function habitStreak(id){var t=today(),dt=habitDone(t,id)?t:addDays(t,-1),n=0;while(habitDone(dt,id)&&n<1000){n++;dt=addDays(dt,-1);}return n;}
function habitCard(){
  if(!state.habits.length)return '';
  var t=today();
  return '<div class="card"><h2>Gewohnheiten <small>heute abhaken · Serie in Tagen</small></h2><div class="pill">'+state.habits.map(function(x){var on=habitDone(t,x.id),st=habitStreak(x.id);
    return '<button type="button" data-a="habit" data-id="'+esc(x.id)+'" class="'+(on?'on':'')+'" aria-pressed="'+on+'" style="padding:10px 16px;font-size:.8rem">'+(on?'✓ ':'')+esc(x.name)+(st?' · '+st:'')+'</button>';}).join('')+'</div><div class="hint" style="margin-top:12px">Kalorien &amp; Ernährung trackst du in <a href="'+FIT_URL+'" target="_blank" rel="noopener" style="color:var(--gold-hi)">MB FIT öffnen ↗</a></div></div>';
}
function planner(dt,ph){
  var ts=sorted(tasksOf(dt));
  return (ts.length?'<ul class="tasks">'+ts.map(function(x){return taskRow(x,dt,{noCheck:true,noMove:true});}).join('')+'</ul>':'<div class="hint">Noch nichts geplant.</div>')+addForm(dt,ph);
}
function viewMorgen(){
  var m=addDays(today(),1);
  return '<div class="card"><h2>Morgen <small>'+esc(niceDate(m))+'</small></h2><div class="hint">Wähle bis zu 3 Top-Aufgaben mit dem Stern. Der Rest ist Beiwerk.</div>'+planner(m,'Was hast du morgen vor? …')+'</div>';
}
function viewAbend(){
  var t=today(),d=ensureDay(t),ts=sorted(d.tasks);
  var h='<div class="steps">'+['1 · Aufgaben','2 · Bewertung','3 · Morgen'].map(function(s,i){return '<div class="'+(ui.step===i+1?'on':(ui.step>i+1?'ok':''))+'" data-a="step" data-n="'+(i+1)+'">'+s+'</div>';}).join('')+'</div>';
  if(d.reviewed&&ui.step===1&&!ui.editReview){
    h+='<div class="card"><h2>Tag abgeschlossen</h2><div class="hint">Du hast den Abend für heute schon gemacht. Serie: <b class="mono" style="color:var(--gold-hi)">'+streak()+'</b> Tage.</div><div class="row" style="margin-top:12px"><button class="btn ghost small" data-a="reopen">Nochmal bearbeiten</button></div></div>';
    return h;
  }
  if(ui.step===1){
    var open=ts.filter(function(x){return !x.done;});
    h+='<div class="card"><h2>Was ist heute passiert? <small>'+esc(niceDate(t))+'</small></h2>'+
      (ts.length?'<ul class="tasks">'+ts.map(function(x){return taskRow(x,t,{});}).join('')+'</ul>':'<div class="hint">Heute war nichts geplant. Du kannst unten nachtragen, was du getan hast.</div>')+
      addForm(t,'Etwas nachtragen …')+
      (open.length?'<div class="row" style="margin-top:16px"><button class="btn ghost small" data-a="moveall">Alle '+open.length+' offenen auf morgen schieben</button></div>':'')+
      '</div><div class="row"><button class="btn" data-a="step" data-n="2">Weiter zur Bewertung</button></div>';
  }else if(ui.step===2){
    h+='<div class="card"><h2>Wie war der Tag? <small>1 = schlecht · 10 = stark</small></h2>'+
      RATINGS.map(function(r){var v=d.ratings[r[0]];return '<div class="slider"><label for="r_'+r[0]+'">'+r[1]+'</label><input type="range" id="r_'+r[0]+'" min="1" max="10" step="1" value="'+(typeof v==='number'?v:5)+'" data-i="rating" data-k="'+r[0]+'"><output id="o_'+r[0]+'">'+(typeof v==='number'?v:'–')+'</output></div>';}).join('')+'</div>'+
      '<div class="card"><h2>Meine Erfolge heute <small>auch kleine zählen</small></h2>'+
      [0,1,2].map(function(i){return '<div style="margin-bottom:10px"><input type="text" id="e_'+i+'" data-i="erfolg" data-k="'+i+'" maxlength="160" placeholder="Erfolg '+(i+1)+'" value="'+esc(d.erfolge[i])+'" autocomplete="off"></div>';}).join('')+
      '<label class="lb" for="t_dankbar">Dafür bin ich dankbar</label><textarea id="t_dankbar" data-i="text" data-k="dankbar">'+esc(d.dankbar||'')+'</textarea></div>'+
      '<div class="card"><h2>Rückblick</h2>'+
      '<label class="lb" for="t_gut" style="margin-top:0">Was lief gut?</label><textarea id="t_gut" data-i="text" data-k="gut">'+esc(d.gut)+'</textarea>'+
      '<label class="lb" for="t_schlecht">Was lief weniger gut?</label><textarea id="t_schlecht" data-i="text" data-k="schlecht">'+esc(d.schlecht)+'</textarea>'+
      '<label class="lb" for="t_gelernt">Was nimmst du mit? <small>(ein Satz reicht)</small></label><textarea id="t_gelernt" data-i="text" data-k="gelernt">'+esc(d.gelernt)+'</textarea></div>'+
      '<div class="row"><button class="btn ghost" data-a="step" data-n="1">Zurück</button><button class="btn" data-a="step" data-n="3">Weiter zu morgen</button></div>';
  }else{
    var m=addDays(t,1);
    h+='<div class="card"><h2>Plan für morgen <small>'+esc(niceDate(m))+'</small></h2><div class="hint">Bis zu 3 Top-Aufgaben mit dem Stern markieren.</div>'+planner(m,'Was hast du morgen vor? …')+'</div>'+
      '<div class="row"><button class="btn ghost" data-a="step" data-n="2">Zurück</button><button class="btn" data-a="finish">Tag abschließen</button></div>';
  }
  return h;
}

/* --- Diagramme --- */
function compassRadar(){
  var days=range(today(),30),agg={},areas=state.areas.slice(),n=areas.length;
  areas.forEach(function(a){agg[a]=0;});
  days.forEach(function(dt){tasksOf(dt).forEach(function(t){if(t.done&&t.area&&agg.hasOwnProperty(t.area))agg[t.area]++;});});
  var max=Math.max.apply(null,areas.map(function(a){return agg[a];}));
  if(n<3||!max)return '<div class="hint">Sobald du Aufgaben erledigst, zeigt der Kompass hier, welche Lebensbereiche du pflegst.</div>';
  var W=600,H=380,cx=W/2,cy=H/2,R=128,i,ring='',spokes='',labels='',pts=[];
  [0.25,0.5,0.75,1].forEach(function(f){
    var p=[];for(i=0;i<n;i++){var a=-Math.PI/2+i*2*Math.PI/n;p.push((cx+R*f*Math.cos(a)).toFixed(1)+','+(cy+R*f*Math.sin(a)).toFixed(1));}
    ring+='<polygon points="'+p.join(' ')+'" fill="none" stroke="'+(f===1?'rgba(212,175,55,.4)':'rgba(212,175,55,.14)')+'" stroke-width="1"/>';
  });
  for(i=0;i<n;i++){
    var a=-Math.PI/2+i*2*Math.PI/n,v=agg[areas[i]]/max,x=cx+R*Math.cos(a),y=cy+R*Math.sin(a);
    spokes+='<line x1="'+cx+'" y1="'+cy+'" x2="'+x.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="rgba(212,175,55,.14)"/>';
    pts.push({x:(cx+R*v*Math.cos(a)).toFixed(1),y:(cy+R*v*Math.sin(a)).toFixed(1),n:agg[areas[i]],a:areas[i]});
    var lx=cx+(R+26)*Math.cos(a),ly=cy+(R+26)*Math.sin(a),anc=Math.abs(Math.cos(a))<.25?'middle':(Math.cos(a)>0?'start':'end');
    labels+='<text x="'+lx.toFixed(1)+'" y="'+(ly+3).toFixed(1)+'" text-anchor="'+anc+'" style="font-size:10.5px;fill:#bdbdd0">'+esc(areas[i])+'</text>';
  }
  var poly=pts.map(function(p){return p.x+','+p.y;}).join(' ');
  var dots=pts.map(function(p){return '<circle cx="'+p.x+'" cy="'+p.y+'" r="4" fill="#D4AF37"><title>'+esc(p.a+': '+p.n)+'</title></circle>';}).join('');
  return '<div class="radar-wrap"><svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-width:520px" role="img" aria-label="Lebensbereiche-Kompass"><defs><radialGradient id="rad"><stop offset="0" stop-color="#D4AF37" stop-opacity=".08"/><stop offset="1" stop-color="#D4AF37" stop-opacity=".36"/></radialGradient></defs>'+ring+spokes+'<polygon class="radar-shape" points="'+poly+'" fill="url(#rad)" stroke="#D4AF37" stroke-width="1.6" stroke-linejoin="round"/>'+dots+labels+'</svg></div>';
}
function heatmap(){
  var t=today(),mon=mondayOf(t),start=addDays(mon,-77),cells=[],i;
  for(i=0;i<84;i++){
    var dt=addDays(start,i),s=dayStats(dt),v=null;
    if(dt>t){cells.push('<i style="opacity:.25" title="'+dt+'"></i>');continue;}
    if(s){ if(ui.hm==='score'&&s.score!==null)v=(s.score-1)/9; else if(ui.hm==='quote'&&s.quote!==null)v=s.quote; }
    cells.push('<i data-dt="'+dt+'" title="'+esc(shortDate(dt)+(v===null?' – keine Daten':' – '+(ui.hm==='score'?s.score.toFixed(1).replace('.',','):Math.round(v*100)+' %')))+'" style="'+(v===null?'':'background:'+colFor(v))+'"></i>');
  }
  return '<div class="heat">'+cells.join('')+'</div>';
}
function weekBars(){
  var t=today(),mon=mondayOf(t),W=8,i,bars='';
  var data=[];for(i=W-1;i>=0;i--){var ws=addDays(mon,-7*i),days=range(addDays(ws,6),7).filter(function(dt){return dt<=t;});data.push({ws:ws,q:quoteOver(days)});}
  var w=560,h=150,bw=40,gap=(w-W*bw)/(W+1);
  data.forEach(function(d,k){
    var x=gap+k*(bw+gap),bh=d.q===null?0:Math.max(2,d.q*100);
    bars+='<rect x="'+x.toFixed(1)+'" y="'+(110-bh).toFixed(1)+'" width="'+bw+'" height="'+bh.toFixed(1)+'" rx="5" fill="'+(d.q===null?'#17172b':colFor(d.q))+'"/>'+
      '<text x="'+(x+bw/2).toFixed(1)+'" y="'+(d.q===null?106:104-bh).toFixed(1)+'" text-anchor="middle">'+(d.q===null?'–':Math.round(d.q*100)+'%')+'</text>'+
      '<text x="'+(x+bw/2).toFixed(1)+'" y="130" text-anchor="middle">'+esc(shortDate(d.ws))+'</text>';
  });
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" role="img" aria-label="Erledigt-Quote pro Woche">'+bars+'<line x1="0" y1="110.5" x2="'+w+'" y2="110.5" stroke="#23233a"/></svg>';
}
function lineChart(key){
  var days=range(today(),30),pts=[],w=560,h=170,L=24,R=8,T=10,B=24;
  days.forEach(function(dt,k){var d=state.days[dt];if(d&&d.ratings&&typeof d.ratings[key]==='number')pts.push({k:k,v:d.ratings[key],dt:dt});});
  function X(k){return L+k*(w-L-R)/29;} function Y(v){return T+(10-v)*(h-T-B)/9;}
  var g='',v;
  for(v=1;v<=10;v+=3)g+='<line x1="'+L+'" x2="'+(w-R)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'" stroke="#17172b"/><text x="0" y="'+(Y(v)+3).toFixed(1)+'">'+v+'</text>';
  [0,7,14,21,29].forEach(function(k){g+='<text x="'+X(k).toFixed(1)+'" y="'+(h-6)+'" text-anchor="'+(k===29?'end':(k===0?'start':'middle'))+'">'+esc(shortDate(days[k]))+'</text>';});
  if(!pts.length)return '<div class="hint">Noch keine Bewertungen in den letzten 30 Tagen.</div>';
  var path=pts.map(function(p,k){return (k?'L':'M')+X(p.k).toFixed(1)+' '+Y(p.v).toFixed(1);}).join(' ');
  var dots=pts.map(function(p){return '<circle cx="'+X(p.k).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="3.5" fill="#D4AF37"><title>'+esc(shortDate(p.dt)+': '+p.v)+'</title></circle>';}).join('');
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" role="img" aria-label="Verlauf">'+g+'<path d="'+path+'" fill="none" stroke="#D4AF37" stroke-width="2" stroke-linejoin="round"/>'+dots+'</svg>';
}
function areaBars(){
  var days=range(today(),30),agg={};
  days.forEach(function(dt){tasksOf(dt).forEach(function(t){var a=t.area||'Ohne Bereich';agg[a]=agg[a]||{t:0,d:0};agg[a].t++;if(t.done)agg[a].d++;});});
  var keys=Object.keys(agg).sort(function(a,b){return agg[b].t-agg[a].t;});
  if(!keys.length)return '<div class="hint">Noch keine Aufgaben in den letzten 30 Tagen.</div>';
  var max=Math.max.apply(null,keys.map(function(k){return agg[k].t;}));
  return keys.map(function(k){var a=agg[k];return '<div style="margin:10px 0"><div class="row" style="justify-content:space-between;font-size:.9rem;font-weight:300"><span>'+esc(k)+'</span><span class="mono muted">'+a.d+' / '+a.t+'</span></div><div style="height:8px;background:#14142a;border-radius:6px;overflow:hidden;margin-top:5px"><div style="height:100%;width:'+(a.t/max*100).toFixed(1)+'%;background:rgba(212,175,55,.25)"><div style="height:100%;width:'+(a.d/a.t*100).toFixed(1)+'%;background:linear-gradient(90deg,#a8872a,#f3df97)"></div></div></div></div>';}).join('');
}
function weekReview(){
  var days=range(today(),7),rows=days.map(dayStats).filter(function(s){return s;}),h='';
  if(!rows.length)return '<div class="hint">In den letzten 7 Tagen gibt es noch keine Einträge.</div>';
  var q=quoteOver(days),withScore=rows.filter(function(s){return s.score!==null;});
  h+='<div class="hint" style="padding-top:0">Erledigt: <b class="mono" style="color:var(--gold-hi)">'+(q===null?'–':Math.round(q*100)+' %')+'</b>'+(withScore.length?' · Ø Gesamtgefühl <b class="mono" style="color:var(--gold-hi)">'+mean(withScore.map(function(s){return s.score;})).toFixed(1).replace('.',',')+'</b>':'')+'</div>';
  if(withScore.length>=2){
    var best=withScore.slice().sort(function(a,b){return b.score-a.score;})[0],worst=withScore.slice().sort(function(a,b){return a.score-b.score;})[0];
    h+='<div class="hint">Bester Tag: <b>'+esc(niceDate(best.dt))+'</b> ('+best.score.toFixed(1).replace('.',',')+') · Schwächster: <b>'+esc(niceDate(worst.dt))+'</b> ('+worst.score.toFixed(1).replace('.',',')+')</div>';
  }
  var groups=[['erfolge','Erfolge der Woche'],['gut','Lief gut'],['schlecht','Lief weniger gut'],['gelernt','Mitgenommen'],['dankbar','Dankbar für']];
  groups.forEach(function(g){
    var es=[];
    days.forEach(function(dt){var d=state.days[dt];if(!d)return;
      if(g[0]==='erfolge')(d.erfolge||[]).forEach(function(e){if(e&&e.trim())es.push({dt:dt,t:e});});
      else if(d[g[0]]&&String(d[g[0]]).trim())es.push({dt:dt,t:d[g[0]]});});
    if(!es.length)return;
    h+='<h3>'+g[1]+'</h3>'+es.map(function(e){return '<div class="entry"><small>'+esc(shortDate(e.dt))+'</small>'+esc(e.t)+'</div>';}).join('');
  });
  return h;
}
function viewAuswertung(){
  var t=today(),d7=range(t,7),q=quoteOver(d7),st=avgRating('stimmung',d7),ins=insights();
  var h='<div class="kpis"><div class="kpi"><b>'+streak()+'</b><span>Tage Serie</span></div>'+
    '<div class="kpi"><b>'+(q===null?'–':Math.round(q*100)+'%')+'</b><span>erledigt · 7 Tage</span></div>'+
    '<div class="kpi"><b>'+(st===null?'–':st.toFixed(1).replace('.',','))+'</b><span>Ø Stimmung · 7 Tage</span></div>'+
    '<div class="kpi"><b>'+erfolgeCount()+'</b><span>Erfolge notiert</span></div></div>';
  h+='<div class="card"><h2>Dein Kompass <small>erledigte Aufgaben je Lebensbereich · 30 Tage</small></h2>'+compassRadar()+'</div>';
  h+=habitCalendar();
  h+='<div class="card"><h2>Die letzten 12 Wochen</h2><div class="pill" style="margin-bottom:14px"><button data-a="hm" data-v="score" class="'+(ui.hm==='score'?'on':'')+'">Gesamtgefühl</button><button data-a="hm" data-v="quote" class="'+(ui.hm==='quote'?'on':'')+'">Erledigt-Quote</button></div>'+heatmap()+
    '<div class="legend"><span><i style="background:'+colFor(0)+'"></i>schwach</span><span><i style="background:'+colFor(.5)+'"></i>mittel</span><span><i style="background:'+colFor(1)+'"></i>stark</span><span><i style="background:#14142a"></i>keine Daten</span></div></div>';
  h+='<div class="card"><h2>Erledigt pro Woche</h2>'+weekBars()+'</div>';

  if(s){
    h+='<div class="hint">Angemeldet als <b>'+esc(s.email)+'</b>. Deine Einträge werden automatisch auf allen angemeldeten Geräten abgeglichen.</div>'+
      '<div class="st '+(sync.msg?'':'ok')+'">'+(sync.msg?esc(sync.msg):(sync.ok?'Zuletzt synchronisiert um '+pad(new Date(sync.ok).getHours())+':'+pad(new Date(sync.ok).getMinutes())+' Uhr':'Noch nicht synchronisiert'))+'</div>'+
      '<div class="row" style="margin-top:12px"><button class="btn" data-a="syncnow">Jetzt abgleichen</button><button class="btn ghost" data-a="logout">Abmelden</button></div>';
  }else if(authUI.stage==='code'){
    h+='<div class="hint">Wir haben einen Code an <b>'+esc(authUI.email)+'</b> geschickt. Gib ihn hier ein (oder tippe auf den Link in der E-Mail).</div>'+
      '<form class="add" data-f="code" style="margin-top:12px"><input type="text" name="code" inputmode="numeric" autocomplete="one-time-code" placeholder="Code aus der E-Mail" maxlength="10"><button class="btn" type="submit"'+(authUI.busy?' disabled':'')+'>Bestätigen</button></form>'+
      '<div class="hint"><a href="#" data-a="authback" style="color:var(--gold-hi)">Andere E-Mail verwenden</a></div>';
  }else{
    h+='<div class="hint">Melde dich einmalig mit deiner E-Mail an – dann sind iPad, Handy und PC synchron. Kein Passwort nötig.</div>'+
      '<form class="add" data-f="login" style="margin-top:12px"><input type="text" name="email" inputmode="email" autocomplete="email" placeholder="E-Mail-Adresse" value="'+esc(authUI.email)+'"><button class="btn" type="submit"'+(authUI.busy?' disabled':'')+'>Code senden</button></form>';
  }
  if(authUI.err)h+='<div class="hint bad">'+esc(authUI.err)+'</div>';
  return h+'</div>';
}

/* ====== Abendmodus (Blaulicht-Filter, nur dieses Gerät) ====== */
var NIGHT_KEY='lebenskompass.night';
function nightMode(){try{return localStorage.getItem(NIGHT_KEY)||'auto';}catch(e){return 'auto';}}
function applyNight(){
  var m=nightMode(),h=new Date().getHours(),on=m==='an'||(m==='auto'&&(h>=19||h<8));
  var el=document.getElementById('nightfilter');if(el)el.className=on?'on':'';
}
function nightCard(){
  var m=nightMode();
  return '<div class="card"><h2>Anzeige <small>nur dieses Gerät</small></h2><div class="hint" style="margin-bottom:12px">Warmer Abendmodus: nimmt Blaulicht heraus, angenehm fürs Journaling abends und morgens.</div><div class="pill">'+
    [['auto','Automatisch (19–8 Uhr)'],['an','Immer warm'],['aus','Aus']].map(function(x){return '<button data-a="night" data-v="'+x[0]+'" class="'+(m===x[0]?'on':'')+'">'+x[1]+'</button>';}).join('')+'</div></div>';
}

/* ====== Rendern ====== */
function render(keepFocus){
  updateHeader();
  document.getElementById('nav').innerHTML=TABS.map(function(t){return '<button class="'+(ui.tab===t[0]||(ui.tab==='review'&&t[0]==='plan')||(ui.tab==='buch'&&t[0]==='heute')?'on':'')+'" data-a="tab" data-v="'+t[0]+'" aria-label="'+t[1]+'">'+IC[t[0]]+t[1]+'</button>';}).join('');
  var v={heute:viewHeute,abend:viewAbend,morgen:viewMorgen,plan:viewPlan,review:viewReview,buch:viewBuch,auswertung:viewAuswertung,daten:viewDaten}[ui.tab];
  document.getElementById('app').innerHTML=v();
  var imp=document.getElementById('imp');
  if(imp)imp.addEventListener('change',importFile);
  if(keepFocus){var inp=document.querySelector('#app form.add input[type=text]');if(inp)inp.focus();}
}

/* ====== Aktionen ====== */
function findTask(dt,id){var ts=tasksOf(dt),i;for(i=0;i<ts.length;i++)if(ts[i].id===id)return ts[i];return null;}
var actions={
  tab:function(d){ui.tab=d.v;ui.editReview=false;if(d.v==='abend')ui.step=1;render();window.scrollTo(0,0);},
  toggle:function(d){var t=findTask(d.dt,d.id);if(t){t.done=!t.done;save();render();}},
  star:function(d){var t=findTask(d.dt,d.id);if(!t)return;if(!t.star&&tasksOf(d.dt).filter(function(x){return x.star;}).length>=3){toast('Maximal 3 Top-Aufgaben');return;}t.star=!t.star;save();render();},
  del:function(d){var ts=ensureDay(d.dt).tasks;state.days[d.dt].tasks=ts.filter(function(x){return x.id!==d.id;});tomb(d.dt,[d.id]);save();render();},
  move:function(d){var t=findTask(d.dt,d.id);if(!t)return;var to=ensureDay(addDays(d.dt,1));state.days[d.dt].tasks=state.days[d.dt].tasks.filter(function(x){return x.id!==d.id;});tomb(d.dt,[d.id]);t.done=false;to.tasks.push(t);save();render();toast('Auf morgen geschoben');},
  moveall:function(){var t=today(),day=ensureDay(t),to=ensureDay(addDays(t,1)),open=day.tasks.filter(function(x){return !x.done;});day.tasks=day.tasks.filter(function(x){return x.done;});tomb(t,open.map(function(x){return x.id;}));open.forEach(function(x){to.tasks.push(x);});save();render();toast(open.length+' Aufgaben auf morgen geschoben');},
  step:function(d){ui.step=+d.n;ui.editReview=true;render();window.scrollTo(0,0);},
  reopen:function(){ui.editReview=true;ui.step=1;render();},
  finish:function(){var d=ensureDay(today());d.reviewed=true;save();ui.step=1;ui.editReview=false;render();toast('Tag abgeschlossen – Serie: '+streak());},
  hm:function(d){ui.hm=d.v;render();},
  habit:function(d){var day=ensureDay(today());if(!day.habits)day.habits={};if(day.habits[d.id])delete day.habits[d.id];else day.habits[d.id]=1;save();render();},
  hdel:function(d){state.habits=state.habits.filter(function(x){return x.id!==d.id;});save();render();},
  night:function(d){try{localStorage.setItem(NIGHT_KEY,d.v);}catch(e){}applyNight();render();},
  book:function(){ui.bday=today();ui.tab='buch';render();window.scrollTo(0,0);},
  bpage:function(d){if(d.v){ui.bday=d.v;render();}},
  chal:function(){var d=ensureDay(today());if(d.chal)delete d.chal;else d.chal=1;save();render();},
  hsel:function(d){ui.hsel=d.id;render();},
  review:function(d){ui.ry=+d.y;ui.tab='review';render();window.scrollTo(0,0);},
  print:function(){window.print();},
  hz:function(d){ui.hz=d.v;ui.off=0;render();},
  poff:function(d){ui.off=(+d.d===0)?0:(ui.off||0)+(+d.d);render();},
  gdel:function(d){var l=goalsOf(d.hz,d.key).filter(function(g){return g.id!==d.id;});state.goals[d.hz][d.key]=l;save();render();},
  syncnow:function(){sync.msg='';syncNow();toast('Gleiche ab …');},
  logout:function(){setSess(null);sync.ok=0;sync.msg='';render();updateHeader();toast('Abgemeldet – Daten bleiben auf diesem Gerät');},
  authback:function(){authUI.stage='email';authUI.err='';render();},
  metric:function(d){ui.metric=d.v;render();},
  export:function(){
    var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download='lebenskompass-backup-'+today()+'.json';document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);toast('Sicherung exportiert');
  }
};
function importFile(e){
  var f=e.target.files&&e.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var s=JSON.parse(r.result);
      s=norm(s);if(!s)throw new Error('format');
      state=s;var now=Date.now();Object.keys(itemsOf(state)).forEach(function(k){state._u[k]=now;});lastItems=itemsOf(state);persist();scheduleSync();render();toast('Sicherung importiert');
    }catch(err){toast('Datei ist keine gültige Sicherung');}
  };
  r.readAsText(f);
}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');if(!b)return;
  var fn=actions[b.dataset.a];if(fn){e.preventDefault();fn(b.dataset);}
});
document.addEventListener('submit',function(e){
  var f=e.target.closest('form[data-f]');if(!f)return;e.preventDefault();
  if(f.dataset.f==='add'){
    var text=f.elements.text.value.trim();if(!text)return;
    var d=ensureDay(f.dataset.dt);d.tasks.push({id:uid(),text:text.slice(0,200),area:f.elements.area.value,done:false,star:false});
    save();render(true);
  }else if(f.dataset.f==='goal'){
    var gt=f.elements.text.value.trim();if(!gt)return;
    var gl=state.goals[f.dataset.hz];if(!gl[f.dataset.key])gl[f.dataset.key]=[];
    var ng={id:uid(),text:gt.slice(0,160),area:f.elements.area.value,pct:0};if(f.elements.parent&&f.elements.parent.value)ng.parent=f.elements.parent.value;gl[f.dataset.key].push(ng);
    save();render(true);
  }else if(f.dataset.f==='login'){
    var em=f.elements.email.value.trim();if(em.indexOf('@')<1){authUI.err='Bitte eine gültige E-Mail eingeben.';render();return;}
    sendCode(em);
  }else if(f.dataset.f==='code'){
    var cd=f.elements.code.value.replace(/\s/g,'');if(cd.length<4)return;verifyCode(cd);
  }else if(f.dataset.f==='habit'){
    var hn=f.elements.habit.value.trim().slice(0,40);if(!hn)return;
    state.habits.push({id:uid(),name:hn});save();render();
  }else if(f.dataset.f==='area'){
    var a=f.elements.area.value.trim().slice(0,40);if(!a)return;
    if(state.areas.indexOf(a)<0){state.areas.push(a);save();toast('Bereich ergänzt');}
    render();
  }
});
document.addEventListener('input',function(e){
  var el=e.target;if(!el.dataset||!el.dataset.i)return;
  var k=el.dataset.k;
  if(el.dataset.i==='bdate'){if(/^\d{4}-\d{2}-\d{2}$/.test(el.value)){ui.bday=el.value;if(!state.days[el.value]){}render();}return;}
  if(el.dataset.i==='name'){state.name=el.value.slice(0,30);save();return;}
  if(el.dataset.i==='gpct'){var gg=goalsOf(el.dataset.hz,el.dataset.key).filter(function(g){return g.id===el.dataset.id;})[0];if(gg){gg.pct=+el.value;var bb=document.getElementById('gb_'+gg.id),oo=document.getElementById('go_'+gg.id);if(bb){bb.style.width=gg.pct+'%';bb.style.background=colFor(gg.pct/100);}if(oo)oo.textContent=gg.pct+'%';save();}return;}
  if(el.dataset.i==='vision'){state.vision[k]=el.value.slice(0,1000);save();return;}
  if(el.dataset.i==='note'){var nk=ui.hz+':'+period(ui.hz,ui.off).key;if(!state.notes[nk])state.notes[nk]={};state.notes[nk][k]=el.value.slice(0,2000);save();return;}
  var d=ensureDay(today());
  if(el.dataset.i==='rating'){d.ratings[k]=+el.value;var o=document.getElementById('o_'+k);if(o)o.textContent=el.value;}
  else if(el.dataset.i==='text'){d[k]=el.value;}
  else if(el.dataset.i==='erfolg'){d.erfolge[+k]=el.value;}
  save();
});
/* Ein Regler zählt erst als bewertet, wenn er berührt wurde. */
document.addEventListener('pointerdown',function(e){
  var el=e.target;if(el.dataset&&el.dataset.i==='rating'){var d=ensureDay(today());if(typeof d.ratings[el.dataset.k]!=='number'){d.ratings[el.dataset.k]=+el.value;var o=document.getElementById('o_'+el.dataset.k);if(o)o.textContent=el.value;save();}}
});
window.LK={state:function(){return state;},today:today,streak:streak,insights:insights,reload:function(){state=load();lastItems=itemsOf(state);render();},sync:syncNow};
document.addEventListener('visibilitychange',function(){if(!document.hidden){syncNow();if(sync.deferRender){sync.deferRender=false;render();}}});
setInterval(function(){if(!document.hidden)syncNow();},60000);
document.addEventListener('focusout',function(){if(sync.deferRender){setTimeout(function(){var a=document.activeElement;if(!(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'))){sync.deferRender=false;render();}},50);}});
(function(){var x0=null;document.addEventListener('touchstart',function(e){if(ui.tab==='buch')x0=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',function(e){if(ui.tab!=='buch'||x0===null)return;var dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)<60)return;var b=document.querySelectorAll('[data-a=bpage]')[dx>0?0:1];if(b&&!b.disabled)b.click();},{passive:true});})();
/* MB FIT auf demselben Gerät/derselben Adresse: automatisch abhaken */
function autoFit(){
  var raw;try{raw=localStorage.getItem('fittracker:db');}catch(e){return;}if(!raw)return;
  var db;try{db=JSON.parse(raw);}catch(e){return;}if(!db||!Array.isArray(db.entries))return;
  var t=today(),h=new Date().getHours(),days=[addDays(t,-1),t],n=0;
  days.forEach(function(dt){
    var d=null;function tick(re){state.habits.forEach(function(x){if(re.test(x.name)){d=d||ensureDay(dt);if(!d.habits)d.habits={};if(!d.habits[x.id]){d.habits[x.id]=1;n++;}}});}
    var es=db.entries.filter(function(e){return e&&e.date===dt;}),kc=es.reduce(function(a,e){return a+(+e.kcal||0);},0),kt=db.profile&&+db.profile.kcalTarget||0;
    if((dt<t||h>=20)&&es.length&&kt&&kc<=kt)tick(/kcal|kalorien/i);
    var log=db.suppLog&&db.suppLog[dt]||{};(db.supplements||[]).forEach(function(sp){if(log[sp.id]&&sp.name){var key=String(sp.name).split(/[\s(]/)[0].toLowerCase();if(key.length>=3)tick(new RegExp(key.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i'));}});
  });
  if(n){save();toast('Aus MB FIT übernommen: '+n+' Gewohnheit'+(n>1?'en':''));}
}
takeHash();
autoFit();
document.addEventListener('visibilitychange',function(){if(!document.hidden){autoFit();if(ui.tab==='heute')render();}});
window.addEventListener('hashchange',function(){if((location.hash||'').length>3){takeHash();render();syncNow();}});
applyNight();setInterval(applyNight,300000);
render();
syncNow();
})();
</script>
